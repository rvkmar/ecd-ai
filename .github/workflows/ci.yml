name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Installing on the Linux runner (rather than reusing a Windows/macOS
      # node_modules) is what actually resolves the native
      # @rollup/rollup-linux-x64-gnu optional-dependency mismatch that has
      # blocked verification in prior sessions.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # D64/D66: existing build-and-test never starts r-backend (confirmed).
  # This job uses the same published image + repo app bind-mount as
  # compose — not a second psychometric stack — and runs the live
  # LSAT7 (mirt) and sim10GDINA (GDINA) enqueue → process → ingest paths.
  lsat7-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pull published R image
        run: docker pull rvkmar/r-backend:latest

      - name: Start r-backend (published image + repo app)
        run: |
          docker run -d --name r-backend \
            -p 4000:4000 \
            -v "$PWD/r-backend/app:/home/app" \
            -e R_BACKEND_APP_DIR=/home/app \
            rvkmar/r-backend:latest \
            Rscript /home/app/start.R
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:4000/health; then
              echo
              echo "r-backend /health is up"
              exit 0
            fi
            sleep 2
          done
          echo "r-backend did not become healthy"
          docker logs r-backend || true
          exit 1

      - name: LSAT7 full pipeline against live R
        env:
          R_BACKEND_URL: http://127.0.0.1:4000
        run: npx vitest run server/r/__tests__/lsat7Pipeline.test.js

      - name: sim10GDINA full pipeline against live R
        env:
          R_BACKEND_URL: http://127.0.0.1:4000
        run: npx vitest run server/r/__tests__/sim10gdinaPipeline.test.js

      - name: Dump R logs on failure
        if: failure()
        run: |
          docker logs r-backend || true
          echo "--- tiny /calibrate/irt ---"
          curl -sS -X POST http://127.0.0.1:4000/calibrate/irt \
            -H 'Content-Type: application/json' \
            --data-binary @r-backend/app/tests/fixtures/valid-request.json | head -c 4000
          echo
