name: Sync Master and Main Branches

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Git config
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Sync Main to Master
        if: github.ref == 'refs/heads/main'
        run: |
          git checkout master
          git merge origin/main --ff-only || git merge origin/main -m "Automated merge main into master"
          git push origin master

      - name: Sync Master to Main
        if: github.ref == 'refs/heads/master'
        run: |
          git checkout main
          git merge origin/master --ff-only || git merge origin/master -m "Automated merge master into main"
          git push origin main
