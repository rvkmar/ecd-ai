# version: "3.9"

services:
  node:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: ecd-node
    environment:
      - NODE_ENV=production
      - DB_MODE=mongo
      # Mongo now requires auth (see the `mongo` service below) — credentials
      # come from the root .env file, never hardcoded here.
      - MONGO_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/ecd_assessment?authSource=admin
      # No fallback value on purpose: server/config/jwt.js refuses to start
      # without a real secret. Set JWT_SECRET in your .env (see .env.example).
      - JWT_SECRET=${JWT_SECRET}
      - TOKEN_EXPIRES_IN=8h
      - R_BACKEND_URL=http://r-backend:4000
      - R_SERVICE_TOKEN=${R_SERVICE_TOKEN:-}
      - CALIBRATION_QUEUE_AUTORUN=1
      - ECD_DB_FILE=/data/db.json
      - ECD_BACKUP_DIR=/data/backups
    depends_on:
      - mongo
      - r-backend
    volumes:
      - ecd_data:/data
    expose:
      - "3000"
    restart: always

  mongo:
    image: mongo:6.0
    container_name: ecd-mongo
    restart: always
    environment:
      # Previously ran with no authentication at all *and* published
      # 27017 to the host, so anyone who could reach the host network could
      # connect with zero credentials and read every collection (including
      # bcrypt password hashes). Now requires a root user/password and is
      # only reachable from other containers on this compose network — not
      # published to the host. For local inspection with a GUI client, add a
      # port mapping to docker-compose.override.yml (gitignored) instead of
      # exposing it here.
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db

  # Private compose-network service. Prefer expose, not host ports -- the
  # same lesson mongo already learned. A local override may publish 4000
  # for debugging; the browser must still never call this service (no CORS).
  r-backend:
    build:
      context: ./r-backend
    container_name: ecd-r-backend
    command: Rscript /home/app/start.R
    environment:
      - R_SERVICE_TOKEN=${R_SERVICE_TOKEN:-}
    expose:
      - "4000"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: ecd-nginx
    ports:
      - "6060:80"
    depends_on:
      - node
    restart: always

volumes:
  ecd_data:
  mongo_data: